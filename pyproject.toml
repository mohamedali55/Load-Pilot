[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "loadpilot"
version = "0.1.0"
description = "A unified cost-aware scheduling engine with admission control, fair scheduling, resource management, and adaptive concurrency."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Mohamed Ali" },
]
keywords = ["scheduling", "load-balancing", "admission-control", "fair-scheduling", "async"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Distributed Computing",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
]
metrics = [
    "prometheus-client>=0.20",
]

[tool.hatch.build.targets.wheel]
packages = ["src/loadpilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "benchmark: marks benchmark tests",
]

[tool.ruff]
target-version = "py312"
line-length = 100
